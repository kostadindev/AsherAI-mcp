name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Packs the package, installs the tarball into an empty project and drives the installed bins over stdio.
      - run: npm run test:package
      # Fails if the detectors drop below the precision/recall targets on the tuning corpus.
      - run: npm run accuracy
